name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 저장소 Actions 탭에서 수동으로도 돌릴 수 있게 열어 둔다
  workflow_dispatch:

# deploy-pages 액션이 요구하는 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끝까지 두고 다음 커밋을 이어서 올린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages 설정에서 실제 배포 경로를 받아온다.
      # 프로젝트 페이지면 /MCMcare_Front, 커스텀 도메인이면 / 를 돌려주므로
      # 어느 쪽이든 자산 경로가 어긋나지 않는다.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          # 백엔드 주소는 .env.production 에만 둔다.
          # 저장소 변수(vars.VITE_API_BASE_URL)를 함께 넘기면 process.env 가 우선이라
          # 파일 값을 덮어써 버린다. 실제로 그 때문에 /api 가 빠진 주소로 빌드된 적이 있다.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
